    '<h2>'+esc(item.title)+'</h2>'+
    '<a class="pi-author" href="#"><span class="avatar">'+esc(authorName(item.author).slice(0,1))+'</span><span>'+esc(authorName(item.author))+' <em>'+esc(authorHandle(item.author))+'</em></span><span class="go"><svg class="i"><use href="#i-external-link"/></svg></span></a>'+
    '<div class="pv-favrow"><button class="pv-fav" type="button"><svg class="i"><use href="#i-bookmark"/></svg><span>收藏</span></button><button class="pv-star" type="button"><svg class="i"><use href="#i-star"/></svg><span>星标</span></button></div>'+
    '<div class="pi-acts"><button class="pi-act" type="button"><svg class="i"><use href="#i-pencil"/></svg>重命名</button><button class="pi-act" type="button"><svg class="i"><use href="#i-folder-input"/></svg>移动</button><button class="pi-act" type="button"><svg class="i"><use href="#i-folder-open"/></svg>定位</button><button class="pi-act danger" type="button"><svg class="i"><use href="#i-trash-2"/></svg><span>删除</span></button></div>'+
    '<section class="pi-group" style="--grp:#3FC9BE"><h3 class="pi-label">文件</h3>'+
      '<div class="pi-stats"><div class="stat"><b>'+item.res+'</b><span>分辨率</span></div><div class="stat"><b>'+item.size+'</b><span>大小</span></div><div class="stat"><b>'+item.time+'</b><span>保存</span></div></div>'+
      '<details class="pi-fold"><summary>更多文件信息<i>›</i></summary><dl class="pi-list">'+
        (item.type==='anim'?'<div class="pi-item"><dt><svg class="k-ico"><use href="#i-clock"/></svg>帧数</dt><dd>'+item.dur+'</dd></div>':'')+
        '<div class="pi-item"><dt><svg class="k-ico"><use href="#i-calendar"/></svg>保存时间</dt><dd>2026-11-09 '+item.time+'</dd></div>'+
        '<div class="pi-item"><dt><svg class="k-ico"><use href="#i-folder"/></svg>路径</dt><dd class="mono">'+esc(item.site)+'/'+esc(authorHandle(item.author).replace('@',''))+'/'+TYPE_N[item.type]+'/1.jpg</dd><button class="inline-copy" type="button" title="复制路径"><svg class="i"><use href="#i-copy"/></svg></button></div>'+
      '</dl></details>'+
    '</section>'+
    '<section class="pi-group" style="--grp:#F0C878"><h3 class="pi-label">来源 <span class="pi-badge"><svg class="i"><use href="#i-circle-check"/></svg>已记录</span></h3><dl class="pi-list">'+
      '<a class="pi-item" href="#"><dt><svg class="k-ico"><use href="#i-external-link"/></svg>原帖</dt><dd class="mono">'+s.n+'.com/v/xxxx</dd><span class="go">↗</span></a>'+
      '<div class="pi-item"><dt><svg class="k-ico"><use href="#i-link"/></svg>直链</dt><dd class="mono">cdn.'+esc(item.site)+'.com/…</dd><span class="tag-warn" title="直链会过期"><svg class="i"><use href="#i-triangle-alert"/></svg></span><button class="inline-copy" type="button"><svg class="i"><use href="#i-copy"/></svg>复制</button></div>'+
      '<details class="pi-fold"><summary>溯源详情<i>›</i></summary><dl class="pi-list"><div class="pi-item"><dt><svg class="k-ico"><use href="#i-hash"/></svg>作品 ID</dt><dd class="mono">72xx</dd></div></dl></details>'+
    '</dl></section>'+
    '<section class="pi-group grp-tags" style="--grp:#B4A5F5"><h3 class="pi-label">标签</h3><div class="pi-tags"><div class="pv-tags"><span class="pv-tag">'+TYPE_N[item.type]+'</span><span class="pv-tag">'+s.n+'</span></div><button class="pi-tag-add" type="button">+ 添加</button></div></section>'+
    '<div class="pi-more"><div class="pi-more-head"><span>同作者 · <b>8</b> 项</span><button type="button">查看全部</button></div></div>'+
    '<div class="pi-foot">按 <kbd>?</kbd> 查看全部键盘与鼠标操作</div>';
}
function renderDetail(item,target){document.getElementById(target).innerHTML=detailHTML(item);}

/* 全屏预览 */
function openPreview(item){
  var s=SITES[item.site];
  document.getElementById('pvType').textContent=item.type==='video'?'VIDEO':item.type==='anim'?'GIF':'IMAGE';
  document.getElementById('pvCrumb').innerHTML='<b>'+s.n+'</b> / '+esc(authorName(item.author))+' / '+TYPE_N[item.type]+'s';
  var cover=document.getElementById('pvCover');
  cover.style.setProperty('--h',item.hue);
  cover.innerHTML='<span class="fig"><svg class="i"><use href="#'+TYPE_ICO[item.type]+'"/></svg></span>';
  document.getElementById('pvInfo').innerHTML=detailHTML(item);
  document.getElementById('pvFilm').innerHTML=ITEMS.slice(0,10).map(function(i){return '<div class="film'+(i===item?' active':'')+'"><div class="cover" style="--h:'+i.hue+'"><span class="fig"><svg class="i"><use href="#'+TYPE_ICO[i.type]+'"/></svg></span></div></div>';}).join('');
  document.getElementById('preview').classList.remove('hidden');
}

/* ============ 事件 ============ */
document.addEventListener('click',function(e){
  var nt=e.target.closest('.nav-tab');
  if(nt){
    document.querySelectorAll('.nav-tab').forEach(function(t){t.classList.remove('active');});
    nt.classList.add('active');
    var sc=nt.dataset.scheme;
    document.querySelectorAll('.scheme').forEach(function(s){s.classList.remove('active');});
    document.getElementById('scheme-'+sc).classList.add('active');
    return;
  }
  var card=e.target.closest('[data-item]');
  if(card){
    var it=ITEMS[+card.dataset.item];
    var scheme=card.closest('.scheme').id.replace('scheme-','');
    if(scheme==='a'||scheme==='b'){openPreview(it);}
    else if(scheme==='c'){renderDetail(it,'c-detail');document.querySelectorAll('#c-list .card').forEach(function(r){r.classList.remove('selected');});card.classList.add('selected');}
    return;
  }
  if(e.target.closest('[data-close]')){
    document.getElementById('preview').classList.add('hidden');
    return;
  }
  var segb=e.target.closest('.seg button');
  if(segb){
    var seg=segb.closest('.seg');seg.querySelectorAll('button').forEach(function(b){b.classList.remove('active');});segb.classList.add('active');
    var type=segb.dataset.type;var sid=seg.id.split('-')[0];
    if(sid==='a')renderA(type);else if(sid==='b')renderB(type);else if(sid==='c')renderC(type);
    return;
  }
});

renderA('all');renderB('all');renderC('all');
</script>
</body>
