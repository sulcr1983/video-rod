<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>苏哥的钓鱼竿 video-rod — popup 入口层原型 v3（B+D 统一）</title>
<style>
/* ============================================================
   popup 入口层 · 方案A「收网」+ B+D 定稿配色
   B 纸感（管理面）：暖白纸 #F7F4EE + 赭石 #A8502E + 近黑 #1F1D1A
   与 media-library-redesign-v1 / settings-redesign-v1 同一套 token
   ============================================================ */
:root{
  --bg:#F7F4EE; --surface:#FFFDF8; --surface-2:#F2EEE6; --surface-3:#E8E2D4;
  --ink:#1F1D1A; --ink-2:#4A443A; --muted:#8B8272; --faint:#A79C89;
  --line:#E7E0D3; --line-2:#EFE9DD;
  --primary:#1F1D1A; --accent:#A8502E; --accent-soft:#F7EAE3;
  --danger:#A23B2E; --danger-soft:#F6E7E3; --ok:#3F7A52; --ok-soft:#E7F0EA;
  --r:12px; --r-form:9px;
  --sh-1:0 1px 2px rgba(31,29,26,.06); --sh-2:0 6px 20px rgba(31,29,26,.10); --sh-3:0 18px 48px rgba(31,29,26,.18);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  --serif:Georgia,"Songti SC","Noto Serif SC",serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  font:13px/1.6 var(--font);color:var(--ink);
  background:#E4DED2;-webkit-font-smoothing:antialiased;
  display:flex;flex-direction:column;align-items:center;gap:20px;padding:30px 16px 60px;
}
button{font:inherit;border:0;background:none;cursor:pointer;color:inherit}
input,select{font:inherit;color:inherit}
svg{display:block}
.ic{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.sm{width:13px;height:13px}

/* 舞台说明 */
.stage-note{max-width:400px;text-align:center;color:#6b6357;font-size:12.5px}
.stage-note b{color:var(--accent)}
.stage-note .k{font-family:ui-monospace,Consolas,monospace;background:#fff;border:1px solid var(--line);border-radius:5px;padding:0 5px;font-size:11px}

/* ---------- popup 外壳 380×560 ---------- */
.popup{
  position:relative;width:380px;height:560px;background:var(--bg);
  border-radius:14px;box-shadow:var(--sh-3);overflow:hidden;display:flex;flex-direction:column;
  border:1px solid #d9d2c4;
}
/* 顶栏 */
.pop-head{display:flex;align-items:center;gap:9px;padding:12px 14px 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.pop-head .logo{width:26px;height:26px;flex:0 0 26px}
.pop-title{font-family:var(--serif);font-size:16px;font-weight:600;letter-spacing:.2px}
.pop-title small{font-family:var(--font);font-size:10px;color:var(--faint);font-weight:500;margin-left:5px;letter-spacing:.3px}
.pop-head .ver{font-size:10px;color:var(--faint);background:var(--surface-2);border-radius:20px;padding:1px 7px}
.pop-head .sp{flex:1}
.iconbtn{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2);transition:.14s}
.iconbtn:hover{background:var(--surface-3);color:var(--ink)}
.iconbtn.on{background:var(--accent-soft);color:var(--accent)}

/* 站点条 */
.sitebar{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--line-2)}
.sitebar .site{font-size:11px;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:20px;flex:0 0 auto}
.sitebar .ptitle{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}
.sitebar .count{font-size:11px;color:var(--faint);flex:0 0 auto}
.sitebar .count b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}

/* 本页概览条 */
.overview{display:flex;align-items:center;gap:8px;padding:8px 14px;background:var(--surface);border-bottom:1px solid var(--line-2)}
.ov-types{display:flex;gap:4px}
.ovt{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 9px;border-radius:7px;background:var(--surface-2);font-size:11px;color:var(--ink-2);transition:.12s}
.ovt:hover{background:var(--surface-3)}
.ovt b{font-weight:700;font-variant-numeric:tabular-nums;color:var(--accent)}
.ovt:active{transform:translateY(1px)}
.ov-save{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 9px;border-radius:7px;color:var(--ink-2);font-size:11px;margin-left:auto}
.ov-save:hover{background:var(--surface-3)}
.ov-save .dir{color:var(--muted)}
.ov-q{height:26px;padding:0 9px;border-radius:7px;font-size:11px;color:var(--ok);background:var(--ok-soft)}
.ov-q:hover{filter:brightness(.97)}

/* 页签 */
.tabs{display:flex;gap:2px;padding:0 10px;background:var(--surface);border-bottom:1px solid var(--line)}
.tabs .tab{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;font-size:12px;color:var(--muted);position:relative}
.tabs .tab:hover{color:var(--ink-2)}
.tabs .tab.on{color:var(--ink);font-weight:600}
.tabs .tab.on::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:2px;background:var(--accent);border-radius:2px}
.tabs .tab .q{font-size:10px;color:var(--faint);font-variant-numeric:tabular-nums}
.tabs .tab.on .q{color:var(--accent)}
.tab-ignore{margin-left:auto;display:flex;align-items:center;gap:5px;font-size:11px;color:var(--muted);cursor:pointer;height:34px}
.tab-ignore input{width:14px;height:14px;accent-color:var(--accent)}

/* 筛选 chips */
.filters{display:flex;gap:6px;padding:9px 14px;flex-wrap:wrap}
.fchip{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 11px;border-radius:999px;font-size:11.5px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line)}
.fchip:hover{border-color:var(--surface-3);background:var(--surface-2)}
.fchip.on{background:var(--primary);color:#FBF8F2;border-color:var(--primary)}
.fchip b{font-variant-numeric:tabular-nums;font-weight:600;opacity:.8}
.fchip.imgbtn{margin-left:auto;background:var(--accent);color:#fff;border-color:var(--accent)}
.fchip.imgbtn:hover{background:#93451f}

/* 收网清单 */
.list{flex:1;overflow-y:auto;padding:2px 0}
.row{display:flex;align-items:center;gap:11px;min-height:66px;padding:8px 14px;border-bottom:1px solid var(--line-2);cursor:pointer;transition:background .12s}
.row:hover{background:var(--surface)}
.row .cb{width:18px;height:18px;flex:0 0 18px;border-radius:5px;border:1.5px solid #c9c0af;display:grid;place-items:center;color:transparent;transition:.12s}
.row.on .cb{background:var(--accent);border-color:var(--accent);color:#fff}
.row .cb svg{width:12px;height:12px;stroke-width:2.6}
.row .thumb{width:52px;height:38px;flex:0 0 52px;border-radius:8px;overflow:hidden;position:relative;background:var(--surface-3)}
.row .thumb .cover{position:absolute;inset:0}
.row .thumb .dur{position:absolute;right:3px;bottom:3px;font-size:9px;color:#fff;background:rgba(20,18,15,.72);padding:0 4px;border-radius:5px;font-variant-numeric:tabular-nums}
.row .thumb .fmt{position:absolute;left:3px;top:3px;font-size:8.5px;color:#fff;background:rgba(20,18,15,.6);padding:0 4px;border-radius:4px}
/* 已下载行 */
.row.saved{cursor:default}
.row.saved .thumb{opacity:.5}
.row.saved .name{color:var(--muted)}
.row.saved .cb{opacity:.35}
.row.saved .saved-tag{position:absolute;left:3px;top:3px;font-size:8.5px;color:#fff;background:var(--ok);padding:0 5px;border-radius:4px;display:flex;align-items:center;gap:2px}
.row .thumb{position:relative}
.row .main{flex:1;min-width:0}
.row .name{font-size:12.5px;font-weight:550;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .name:hover{color:var(--accent)}
.row .meta{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:11px;color:var(--muted)}
.row .meta .dot{width:2px;height:2px;border-radius:50%;background:var(--faint)}
.row .meta .pdot{width:6px;height:6px;border-radius:50%;flex:0 0 6px}
.row .meta .sz{font-variant-numeric:tabular-nums;color:var(--ink-2)}
.row .exp{width:24px;height:24px;flex:0 0 24px;border-radius:6px;display:grid;place-items:center;color:var(--faint)}
.row .exp:hover{background:var(--surface-3);color:var(--ink-2)}
.row .exp svg{transition:transform .18s}
.row.open .exp svg{transform:rotate(90deg)}
.row .detail{display:none;flex:0 0 auto;flex-direction:column;gap:2px;font-size:10.5px;color:var(--faint);font-family:ui-monospace,Consolas,monospace;max-width:150px}
.row.open .main{display:flex;flex-direction:column}
.row.open .detail{display:flex}
.row .detail .u{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 底部下载条 */
.foot{display:flex;align-items:center;gap:10px;padding:11px 14px;background:var(--surface);border-top:1px solid var(--line)}
.foot .all{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-2)}
.foot .all .cb{width:16px;height:16px;border-radius:4px;border:1.5px solid #c9c0af;display:grid;place-items:center;color:transparent}
.foot .all.on .cb{background:var(--accent);border-color:var(--accent);color:#fff}
.foot .sum{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.foot .sum b{color:var(--ink)}
.foot .dl{margin-left:auto;display:flex;align-items:center;gap:7px;height:36px;padding:0 18px;border-radius:999px;background:var(--primary);color:#FBF8F2;font-size:13px;font-weight:600;box-shadow:var(--sh-1);transition:.14s}
.foot .dl:hover{background:#000}
.foot .dl:active{transform:translateY(1px)}
.foot .dl:disabled{opacity:.4;cursor:not-allowed}
.foot .dl.ok{background:var(--ok)}

/* ---------- 快捷设置抽屉（覆盖 popup） ---------- */
.drawer{position:absolute;inset:0;background:var(--bg);transform:translateX(100%);transition:.24s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;z-index:20}
.drawer.on{transform:translateX(0)}
.sethead{display:flex;align-items:center;gap:9px;padding:12px 14px;background:var(--surface);border-bottom:1px solid var(--line)}
.sethead .back{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--ink-2)}
.sethead .back:hover{background:var(--surface-3)}
.sethead h3{font-family:var(--serif);font-size:15px;margin:0;font-weight:600}
.setbody{flex:1;overflow-y:auto;padding:6px 0}
.sgroup{padding:12px 14px;border-bottom:1px solid var(--line-2)}
.sgroup .lbl{font-size:10.5px;font-weight:650;color:var(--accent);letter-spacing:.04em;text-transform:uppercase;margin-bottom:9px}
.sline{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:7px 0;font-size:12.5px}
.sline .t{color:var(--ink)}
.sline .s{font-size:11px;color:var(--muted)}
.toggle{width:38px;height:22px;border-radius:999px;background:var(--surface-3);position:relative;transition:.16s;flex:0 0 38px}
.toggle::after{content:"";position:absolute;left:2px;top:2px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:var(--sh-1);transition:.16s}
.toggle.on{background:var(--accent)}
.toggle.on::after{left:18px}
.seg{display:flex;gap:0;background:var(--surface-2);border-radius:8px;padding:2px}
.seg button{flex:1;height:26px;padding:0 10px;border-radius:6px;font-size:11.5px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:var(--sh-1)}
.sline.col{flex-direction:column;align-items:stretch;gap:8px}
.sline.col .top{display:flex;justify-content:space-between;align-items:center}
.tplinput{width:100%;height:32px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r-form);background:var(--surface);font-family:ui-monospace,Consolas,monospace;font-size:11.5px;color:var(--ink)}
.previewline{font-size:10.5px;color:var(--faint);font-family:ui-monospace,Consolas,monospace;margin-top:4px;word-break:break-all}
.previewline b{color:var(--accent)}
.setfoot{padding:12px 14px;background:var(--surface);border-top:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.fullset{display:flex;align-items:center;justify-content:center;gap:8px;height:40px;border-radius:999px;background:var(--primary);color:#FBF8F2;font-size:13px;font-weight:600}
.fullset:hover{background:#000}
.setfoot .hint{text-align:center;font-size:10.5px;color:var(--faint)}

/* ---------- toast ---------- */
#toasts{position:absolute;left:14px;right:14px;bottom:66px;z-index:40;display:flex;flex-direction:column;gap:7px;align-items:stretch}
.toast{padding:9px 11px;border-radius:10px;background:#211d17;color:#F4EFE6;font-size:11.5px;box-shadow:var(--sh-2);opacity:0;transform:translateY(6px);transition:.18s;display:flex;align-items:center;gap:8px}
.toast.on{opacity:1;transform:translateY(0)}
.toast .p{font-size:10px;color:#b8ad9c;font-family:ui-monospace,Consolas,monospace;margin-left:auto;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 空态 */
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty svg{width:34px;height:34px;stroke-width:1.4;color:var(--faint);margin:0 auto 10px}
.empty .h{font-size:13px;color:var(--ink-2);margin-bottom:4px}
.empty .p{font-size:11.5px;color:var(--faint)}

/* 演示控制条 */
.demo{display:flex;gap:8px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 12px;box-shadow:var(--sh-1);font-size:11.5px;color:var(--ink-2)}
.demo button{height:28px;padding:0 12px;border-radius:8px;background:var(--surface-2);font-size:11.5px;color:var(--ink-2)}
.demo button.on{background:var(--accent);color:#fff}
.demo .lab{color:var(--faint)}
</style>
</head>
<body>

<div class="stage-note">
  <b>点图标弹出来的面板</b>（380×560）· 方案 A「收网」+ B+D 统一配色<br>
  顶部三个图标：<span class="k">齿轮</span> 快捷设置 · <span class="k">库</span> 媒体库 · <span class="k">栏</span> 侧边栏
</div>

<!-- ============ popup 外壳 ============ -->
<div class="popup">
  <!-- 顶栏 -->
  <div class="pop-head">
    <svg class="logo" viewBox="0 0 48 48" fill="none">
      <circle cx="24" cy="24" r="22" fill="#F7EAE3"/>
      <path d="M14 30c6-14 14-14 20-8" stroke="#A8502E" stroke-width="2.4" stroke-linecap="round" fill="none"/>
      <path d="M34 22l-3 3 2 4" stroke="#A8502E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <circle cx="15" cy="31" r="2.4" fill="#1F1D1A"/>
    </svg>
    <div class="pop-title">苏哥的钓鱼竿<small>video-rod</small></div>
    <span class="ver" id="vrVer">v1.0</span>
    <span class="sp"></span>
    <button class="iconbtn" id="btnSettings" title="设置">
      <svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <button class="iconbtn" id="vrOpenLibrary" title="媒体库">
      <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    </button>
    <button class="iconbtn" id="vrSidePanel" title="在浏览器侧边栏打开">
      <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><line x1="15" y1="4" x2="15" y2="20"/></svg>
    </button>
  </div>

  <!-- 站点条 -->
  <div class="sitebar">
    <span class="site">哔哩哔哩</span>
    <span class="ptitle">纪录片 · 深海的秘密（全 6 话）</span>
    <span class="count">嗅探到 <b id="vrCount">12</b> 个</span>
  </div>

  <!-- 本页概览条：按类型一键全选 + 存到哪 + 默认画质 -->
  <div class="overview">
    <div class="ov-types">
      <button class="ovt" data-ot="video"><b>4</b> 视频</button>
      <button class="ovt" data-ot="img"><b>1</b> 图片</button>
      <button class="ovt" data-ot="stream"><b>1</b> 流</button>
    </div>
    <button class="ov-save" id="ovSave" title="点击下载到哪">
      <svg class="ic sm" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
      <span class="dir">深海纪录片</span>
    </button>
    <button class="ov-q" id="ovQ" title="默认最高画质，点开可改">画质 最高</button>
  </div>

  <!-- 页签 -->
  <div class="tabs">
    <button class="tab on" data-tab="cur">当前页 <span class="q">6</span></button>
    <button class="tab" data-tab="all">其他页 <span class="q">6</span></button>
    <label class="tab-ignore"><input type="checkbox" id="ignoreDone" checked> 忽略已下载</label>
  </div>

  <!-- 筛选 -->
  <div class="filters">
    <button class="fchip on" data-f="all">全部 <b>6</b></button>
    <button class="fchip" data-f="video">视频 <b>4</b></button>
    <button class="fchip" data-f="img">图片 <b>1</b></button>
    <button class="fchip" data-f="stream">流媒体 <b>1</b></button>
    <button class="fchip imgbtn" id="vrScanImages" title="扫描本页所有图片">
      <svg class="ic sm" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>抓图
    </button>
  </div>

  <!-- 收网清单 -->
  <div class="list" id="list"></div>

  <!-- 底部 -->
  <div class="foot">
    <button class="all on" id="allBtn"><span class="cb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>全选</button>
    <span class="sum">已选 <b id="selN">6</b> · <b id="selSz">486 MB</b></span>
    <button class="dl" id="dlBtn">
      <svg class="ic sm" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      <span id="dlTxt">下载</span>
    </button>
  </div>

  <!-- ============ 快捷设置抽屉 ============ -->
  <div class="drawer" id="vrSettings">
    <div class="sethead">
      <button class="back" id="setBack" aria-label="返回"><svg class="ic" viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button>
      <h3>快捷设置</h3>
    </div>
    <div class="setbody">
      <div class="sgroup">
        <div class="lbl">保存</div>
        <div class="sline"><span class="t">默认最高画质</span><span class="toggle on" data-tg="quality"></span></div>
        <div class="sline"><span class="t">m3u8 自动合并 MP4</span><span class="toggle on" data-tg="merge"></span></div>
        <div class="sline"><span class="t">按站点 / 作者分文件夹</span><span class="toggle on" data-tg="folder"></span></div>
      </div>
      <div class="sgroup">
        <div class="lbl">文件名规则</div>
        <div class="sline col">
          <div class="top"><span class="t">命名模板</span><span class="s">点变量插入</span></div>
          <input class="tplinput" id="tpl" value="${author}/${date}_${title}.${ext}">
          <div class="previewline" id="tplPrev"></div>
        </div>
      </div>
      <div class="sgroup">
        <div class="lbl">嗅探</div>
        <div class="sline"><span class="t">图片自动嗅探</span><span class="toggle on" data-tg="sniff"></span></div>
        <div class="sline col">
          <div class="top"><span class="t">数字角标</span></div>
          <div class="seg" data-seg="badge"><button class="on">开</button><button>关</button></div>
        </div>
      </div>
      <div class="sgroup">
        <div class="lbl">外观</div>
        <div class="sline col">
          <div class="top"><span class="t">主题</span></div>
          <div class="seg" data-seg="theme"><button class="on">纸感（浅色）</button><button>影院（深色）</button></div>
        </div>
      </div>
    </div>
    <div class="setfoot">
      <button class="fullset" id="openFullSet">
        <svg class="ic sm" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
        完整设置页（新标签打开）
      </button>
      <span class="hint">这里只放最常用的开关，全部设置点上面</span>
    </div>
  </div>

  <div id="toasts"></div>
</div>

<!-- 演示控制 -->
<div class="demo">
  <span class="lab">演示</span>
  <button id="dFew">6 条</button>
  <button id="dMany" class="on">12 条</button>
  <button id="dEmpty">空态</button>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  /* ---------- 数据 ---------- */
  const PAL=[['#8fb9d9','#4f7fa8'],['#e0b48a','#b07b4f'],['#9dc6a4','#5e8f6b'],['#c9a7c4','#8e6388'],['#e6c98a','#b3945a'],['#9fb8c9','#5f7d92'],['#d9a9a0','#a86a60'],['#a9b6d9','#6b7aa8'],['#bfd0a9','#7f9464'],['#d9c2a9','#a8865f'],['#a9d3d0','#649a97'],['#d3a9b8','#a06078']];
  function cover(i,w,h){const[c1,c2]=PAL[i%12];const s=`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><defs><linearGradient id="g${i}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient></defs><rect width="${w}" height="${h}" fill="url(#g${i})"/><circle cx="${w*.3}" cy="${h*.35}" r="${Math.min(w,h)*.18}" fill="rgba(255,255,255,.18)"/></svg>`;return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s);}

  const VIDS=[
    {t:'第1话 · 阳光层的海流',kind:'video',dur:'12:04',sz:88,plat:'#fb7299',res:'1080P',url:'bilibili.com/video/BV1xx/1.mp4',saved:true},
    {t:'第2话 · 暮色带的微光',kind:'video',dur:'11:38',sz:82,plat:'#fb7299',res:'1080P',url:'bilibili.com/video/BV1xx/2.mp4',saved:true},
    {t:'第3话 · 午夜带的巨乌贼',kind:'video',dur:'13:20',sz:96,plat:'#fb7299',res:'1080P',url:'bilibili.com/video/BV1xx/3.mp4'},
    {t:'第4话 · 深海热泉',kind:'video',dur:'10:52',sz:74,plat:'#fb7299',res:'720P',url:'bilibili.com/video/BV1xx/4.mp4'},
    {t:'封面 · 深海的秘密',kind:'img',sz:2.4,plat:'#fb7299',fmt:'JPG',url:'bilibili.com/cover.jpg'},
    {t:'全片 HLS 流（合并 MP4）',kind:'stream',dur:'48:00',sz:144,plat:'#fb7299',res:'1080P',url:'bilibili.com/master.m3u8'},
  ];
  const MORE=[
    {t:'第5话 · 冷泉与化能生物',kind:'video',dur:'12:41',sz:90,plat:'#fb7299',res:'1080P',url:'bilibili.com/video/BV1xx/5.mp4'},
    {t:'第6话 · 回到海面',kind:'video',dur:'09:58',sz:66,plat:'#fb7299',res:'1080P',url:'bilibili.com/video/BV1xx/6.mp4'},
    {t:'幕后花絮',kind:'video',dur:'05:12',sz:38,plat:'#fb7299',res:'720P',url:'bilibili.com/bonus.mp4'},
    {t:'分P 索引图',kind:'img',sz:1.8,plat:'#fb7299',fmt:'PNG',url:'bilibili.com/index.png'},
    {t:'角色设定图集',kind:'img',sz:3.1,plat:'#fb7299',fmt:'WEBP',url:'bilibili.com/char.webp'},
    {t:'预告片',kind:'video',dur:'01:30',sz:22,plat:'#fb7299',res:'1080P',url:'bilibili.com/trailer.mp4'},
  ];
  let DATA = VIDS.concat(MORE); // 默认 12
  let sel = new Set();
  let filter = 'all';
  let ignoreDone = true;

  function kindMatch(m,f){ if(f==='all')return true; return m.kind===f; }
  function visible(m){ return kindMatch(m,filter) && !m.saved; }  // 主列表永远排除已存；已存只在置灰区显示

  function render(){
    const list=$('list'); list.innerHTML='';
    const rows = DATA.filter(visible);
    if(!rows.length){ list.innerHTML='<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><div class="h">这个筛选下没有内容</div><div class="p">换个类型，或关掉「忽略已下载」看已存的</div></div>'; return; }
    rows.forEach((m)=>{
      const idx=DATA.indexOf(m);
      const on=sel.has(idx);
      const thumb=`<div class="cover"><img src="${cover(idx,104,76)}" style="width:100%;height:100%;object-fit:cover"></div>${m.dur?`<span class="dur">${m.dur}</span>`:''}${m.fmt?`<span class="fmt">${m.fmt}</span>`:''}`;
      const el=document.createElement('div');
      el.className='row'+(on?' on':'');
      el.dataset.i=idx;
      el.innerHTML=`
        <span class="cb"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg></span>
        <div class="thumb">${thumb}</div>
        <div class="main">
          <div class="name" title="点击重命名">${esc(m.t)}</div>
          <div class="meta"><span class="pdot" style="background:${m.plat}"></span>${m.res||m.fmt||''}<span class="dot"></span><span class="sz">${m.sz} MB</span></div>
        </div>
        <div class="detail"><span class="u">${esc(m.url)}</span><span>→ ${esc(pathOf(m))}</span></div>
        <button class="exp" title="展开"><svg class="ic sm" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>`;
      el.querySelector('.cb').onclick=e=>{e.stopPropagation();toggle(idx);};
      el.querySelector('.exp').onclick=e=>{e.stopPropagation();el.classList.toggle('open');};
      el.querySelector('.name').onclick=e=>{e.stopPropagation();rename(m,el.querySelector('.name'));};
      el.onclick=()=>toggle(idx);
      list.appendChild(el);
    });
    // 已下载区（忽略关闭时显示，置灰不可勾）
    if(!ignoreDone){
      DATA.filter(m=>m.saved&&kindMatch(m,filter)).forEach(m=>{
        const idx=DATA.indexOf(m);
        const el=document.createElement('div');
        el.className='row saved';
        el.innerHTML=`
          <span class="cb"></span>
          <div class="thumb"><div class="cover"><img src="${cover(idx,104,76)}" style="width:100%;height:100%;object-fit:cover"></div>${m.dur?`<span class="dur">${m.dur}</span>`:''}<span class="saved-tag">✓ 已存</span></div>
          <div class="main">
            <div class="name">${esc(m.t)}</div>
            <div class="meta"><span class="pdot" style="background:${m.plat}"></span>${m.res||m.fmt||''}<span class="dot"></span><span class="sz">${m.sz} MB</span></div>
          </div>
          <button class="exp" title="展开"><svg class="ic sm" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button>`;
        el.querySelector('.exp').onclick=e=>{e.stopPropagation();el.classList.toggle('open');};
        list.appendChild(el);
      });
    }
    updateFoot();
  }
  function pathOf(m){
    const dir={video:'视频',img:'图片',stream:'视频'}[m.kind];
    return `哔哩哔哩/深海纪录片/${dir}/`;
  }
  function toggle(idx){ sel.has(idx)?sel.delete(idx):sel.add(idx); render(); }
  function rename(m,el){
    const nv=prompt('重命名（下载时用这个名字）',m.t);
    if(nv&&nv.trim()){m.t=nv.trim();render();toast('已改名',m.t);}
  }
  function updateFoot(){
    const rows=DATA.filter(visible);
    const chosen=rows.filter(m=>sel.has(DATA.indexOf(m)));
    $('selN').textContent=chosen.length;
    $('selSz').textContent=chosen.reduce((a,b)=>a+b.sz,0).toFixed(0)+' MB';
    $('vrCount').textContent=DATA.filter(m=>kindMatch(m,filter)).length;
    $('allBtn').classList.toggle('on',rows.length&&chosen.length===rows.length);
    $('dlBtn').disabled=chosen.length===0;
    $('dlTxt').textContent=chosen.length?`下载 ${chosen.length} · ${chosen.reduce((a,b)=>a+b.sz,0).toFixed(0)} MB`:'下载';
  }

  /* 全选 */
  $('allBtn').onclick=()=>{
    const rows=DATA.filter(visible);
    const chosen=rows.filter(m=>sel.has(DATA.indexOf(m)));
    if(chosen.length===rows.length){rows.forEach(m=>sel.delete(DATA.indexOf(m)));}
    else{rows.forEach(m=>sel.add(DATA.indexOf(m)));}
    render();
  };

  /* 概览条：点某类 = 只勾选该类（再点同一类 = 取消该类） */
  document.querySelectorAll('.ovt').forEach(b=>b.onclick=()=>{
    const k=b.dataset.ot;
    const rows=DATA.filter(m=>m.kind===k&&!m.saved);
    const ids=rows.map(m=>DATA.indexOf(m));
    const exactlyThis = ids.length && ids.every(i=>sel.has(i)) && [...sel].every(i=>ids.includes(i));
    if(exactlyThis){ ids.forEach(i=>sel.delete(i)); }
    else { sel=new Set(ids); filter=k; document.querySelectorAll('.fchip[data-f]').forEach(x=>x.classList.toggle('on',x.dataset.f===k)); }
    render();
    toast(exactlyThis?('已取消该类'):('只选 '+rows.length+' 项 '+({video:'视频',img:'图片',stream:'流'}[k])));
  });
  /* 存到哪 */
  $('ovSave').onclick=()=>toast('选择下载文件夹…','当前：哔哩哔哩/深海纪录片/');
  /* 默认画质 */
  $('ovQ').onclick=()=>toast('默认取最高画质（N-05）','要改到展开详情里逐条改');
  /* 忽略已下载 */
  $('ignoreDone').onchange=e=>{ignoreDone=e.target.checked;render();};

  /* 筛选 */
  document.querySelectorAll('.fchip[data-f]').forEach(c=>c.onclick=()=>{
    document.querySelectorAll('.fchip[data-f]').forEach(x=>x.classList.remove('on'));c.classList.add('on');
    filter=c.dataset.f;render();
  });

  /* 页签（媒体控制已收进齿轮→高级） */
  document.querySelectorAll('.tabs .tab').forEach(t=>t.onclick=()=>{
    document.querySelectorAll('.tabs .tab').forEach(x=>x.classList.remove('on'));t.classList.add('on');
    if(t.dataset.tab==='all'){DATA=MORE.slice();sel=new Set();render();toast('切换到其他页缓存');}
    else{DATA=VIDS.concat(MORE);sel=new Set(DATA.filter(m=>!m.saved).map(m=>DATA.indexOf(m)));render();}
  });

  /* 抓图 */
  $('vrScanImages').onclick=()=>toast('已扫描本页图片','Alt+Shift+A 打开清单');

  /* 下载 */
  $('dlBtn').onclick=function(){
    const b=this;b.disabled=true;$('dlTxt').textContent='下载中…';
    let p=0;const t=setInterval(()=>{p+=20;$('dlTxt').textContent='下载中 '+Math.min(p,100)+'%';
      if(p>=100){clearInterval(t);b.classList.add('ok');$('dlTxt').textContent='已保存';
        toast('已存入资源库','哔哩哔哩/深海纪录片/视频/');
        setTimeout(()=>{b.classList.remove('ok');b.disabled=false;render();},1400);}
    },260);
  };

  /* ---------- 快捷设置抽屉 ---------- */
  $('btnSettings').onclick=()=>{$('vrSettings').classList.add('on');$('btnSettings').classList.add('on');paintTpl();};
  $('setBack').onclick=()=>{$('vrSettings').classList.remove('on');$('btnSettings').classList.remove('on');};
  document.querySelectorAll('.toggle').forEach(t=>t.onclick=()=>t.classList.toggle('on'));
  document.querySelectorAll('.seg').forEach(s=>s.querySelectorAll('button').forEach(b=>b.onclick=()=>{s.querySelectorAll('button').forEach(x=>x.classList.remove('on'));b.classList.add('on');if(s.dataset.seg==='theme')toast(b.textContent==='纸感（浅色）'?'已切纸感浅色':'已切影院深色（预览层固定深色）');}));
  $('openFullSet').onclick=()=>toast('正在新标签打开完整设置页…','options.html');
  function paintTpl(){
    const v=$('tpl').value;
    const out=v.replace(/\$\{author\}/g,'<b>深海纪录片</b>').replace(/\$\{date\}/g,'<b>20261104</b>').replace(/\$\{title\}/g,'<b>第3话·午夜带的巨乌贼</b>').replace(/\$\{ext\}/g,'<b>mp4</b>').replace(/\$\{site\}/g,'<b>bilibili</b>').replace(/\$\{index\}/g,'<b>03</b>');
    $('tplPrev').innerHTML='落盘预览：'+out;
  }
  $('tpl').addEventListener('input',paintTpl);

  /* ---------- 媒体库 / 侧边栏 ---------- */
  $('vrOpenLibrary').onclick=()=>toast('正在新标签打开媒体库…','library.html');
  $('vrSidePanel').onclick=()=>toast('已把面板挪到浏览器侧边栏');

  /* ---------- toast ---------- */
  function toast(title,path){
    const t=document.createElement('div');t.className='toast';
    t.innerHTML=`<svg class="ic sm" viewBox="0 0 24 24" style="color:#c9a76a"><path d="M20 6L9 17l-5-5"/></svg><span>${esc(title)}</span>`+(path?`<span class="p">${esc(path)}</span>`:'');
    $('toasts').appendChild(t);requestAnimationFrame(()=>t.classList.add('on'));
    setTimeout(()=>{t.classList.remove('on');setTimeout(()=>t.remove(),240);},2400);
  }

  /* ---------- 演示数据量 ---------- */
  $('dFew').onclick=()=>{DATA=VIDS.slice();sel=new Set(DATA.filter(m=>!m.saved).map(m=>DATA.indexOf(m)));document.querySelectorAll('.demo button').forEach(x=>x.classList.remove('on'));$('dFew').classList.add('on');render();};
  $('dMany').onclick=()=>{DATA=VIDS.concat(MORE);sel=new Set(DATA.filter(m=>!m.saved).map(m=>DATA.indexOf(m)));document.querySelectorAll('.demo button').forEach(x=>x.classList.remove('on'));$('dMany').classList.add('on');render();};
  $('dEmpty').onclick=()=>{DATA=[];sel=new Set();document.querySelectorAll('.demo button').forEach(x=>x.classList.remove('on'));$('dEmpty').classList.add('on');render();};

  /* 初始：全选未下载的 */
  sel=new Set(DATA.filter(m=>!m.saved).map(m=>DATA.indexOf(m)));
  render();
})();
</script>
</body>
</html>
