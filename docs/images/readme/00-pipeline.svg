<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="钓鱼竿下载链路：嗅探 → 命名 → 归档 → 入库 → 检索 → 预览 → 溯源">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#100F0E"/>
      <stop offset="1" stop-color="#17140F"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E8B04B"/>
      <stop offset="1" stop-color="#F2CE86"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="300" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="18" fill="none" stroke="#2A241C"/>

  <text x="48" y="58" fill="#8C8377" font-family="Menlo,Consolas,monospace" font-size="12" letter-spacing="3">ONE PIPELINE</text>
  <text x="48" y="94" fill="#F5F1E8" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="24" font-weight="700">一条链路走完：从网页到可用素材，中间不用你搬文件</text>

  <!-- 节点 -->
  <g font-family="'Microsoft YaHei','PingFang SC',sans-serif">
    <!-- 01 -->
    <g>
      <rect x="48" y="128" width="140" height="86" rx="12" fill="#1B1712" stroke="#3A3025"/>
      <text x="66" y="156" fill="#E8B04B" font-family="Menlo,Consolas,monospace" font-size="12">01</text>
      <text x="66" y="180" fill="#F5F1E8" font-size="16" font-weight="700">嗅探</text>
      <text x="66" y="200" fill="#8C8377" font-size="11.5">全站媒体自动识别</text>
    </g>
    <!-- 02 -->
    <g>
      <rect x="206" y="128" width="140" height="86" rx="12" fill="#1B1712" stroke="#3A3025"/>
      <text x="224" y="156" fill="#E8B04B" font-family="Menlo,Consolas,monospace" font-size="12">02</text>
      <text x="224" y="180" fill="#F5F1E8" font-size="16" font-weight="700">命名</text>
      <text x="224" y="200" fill="#8C8377" font-size="11.5">按模板自动起名</text>
    </g>
    <!-- 03 -->
    <g>
      <rect x="364" y="128" width="140" height="86" rx="12" fill="#1B1712" stroke="#3A3025"/>
      <text x="382" y="156" fill="#E8B04B" font-family="Menlo,Consolas,monospace" font-size="12">03</text>
      <text x="382" y="180" fill="#F5F1E8" font-size="16" font-weight="700">归档</text>
      <text x="382" y="200" fill="#8C8377" font-size="11.5">平台／作者／类型</text>
    </g>
    <!-- 04 -->
    <g>
      <rect x="522" y="128" width="140" height="86" rx="12" fill="#1B1712" stroke="#E8B04B"/>
      <text x="540" y="156" fill="#E8B04B" font-family="Menlo,Consolas,monospace" font-size="12">04</text>
      <text x="540" y="180" fill="#F5F1E8" font-size="16" font-weight="700">入库</text>
      <text x="540" y="200" fill="#C9A05A" font-size="11.5">SHA-256 去重</text>
    </g>
    <!-- 05 -->
    <g>
      <rect x="680" y="128" width="140" height="86" rx="12" fill="#1B1712" stroke="#3A3025"/>
      <text x="698" y="156" fill="#E8B04B" font-family="Menlo,Consolas,monospace" font-size="12">05</text>
      <text x="698" y="180" fill="#F5F1E8" font-size="16" font-weight="700">检索</text>
      <text x="698" y="200" fill="#8C8377" font-size="11.5">词1 词2　-排除</text>
    </g>
    <!-- 06 -->
    <g>
      <rect x="838" y="128" width="140" height="86" rx="12" fill="#1B1712" stroke="#3A3025"/>
      <text x="856" y="156" fill="#E8B04B" font-family="Menlo,Consolas,monospace" font-size="12">06</text>
      <text x="856" y="180" fill="#F5F1E8" font-size="16" font-weight="700">预览</text>
      <text x="856" y="200" fill="#8C8377" font-size="11.5">连播／倍速／缩放</text>
    </g>
    <!-- 07 -->
    <g>
      <rect x="996" y="128" width="156" height="86" rx="12" fill="#1B1712" stroke="#3A3025"/>
      <text x="1014" y="156" fill="#E8B04B" font-family="Menlo,Consolas,monospace" font-size="12">07</text>
      <text x="1014" y="180" fill="#F5F1E8" font-size="16" font-weight="700">溯源</text>
      <text x="1014" y="200" fill="#8C8377" font-size="11.5">原帖／作者／作品 ID</text>
    </g>
  </g>

  <!-- 连线与箭头 -->
  <g stroke="#5A4C36" stroke-width="1.6" fill="none">
    <path d="M188 171 H206"/>
    <path d="M346 171 H364"/>
    <path d="M504 171 H522"/>
    <path d="M662 171 H680"/>
    <path d="M820 171 H838"/>
    <path d="M978 171 H996"/>
  </g>
  <g fill="#8C7A56">
    <path d="M206 171 l-7 -4 v8 z"/>
    <path d="M364 171 l-7 -4 v8 z"/>
    <path d="M522 171 l-7 -4 v8 z"/>
    <path d="M680 171 l-7 -4 v8 z"/>
    <path d="M838 171 l-7 -4 v8 z"/>
    <path d="M996 171 l-7 -4 v8 z"/>
  </g>

  <!-- 底注 -->
  <line x1="48" y1="244" x2="1152" y2="244" stroke="#2A241C"/>
  <text x="48" y="270" fill="#8C8377" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5">
    传统做法：下载器（01）→ 手动改名（02）→ 手动搬文件夹（03）→ Eagle 导入（04）→ 再找一遍（05）
  </text>
  <text x="1152" y="270" text-anchor="end" fill="#E8B04B" font-family="'Microsoft YaHei','PingFang SC',sans-serif" font-size="12.5" font-weight="700">
    钓鱼竿：一条链路，零手动搬运
  </text>
</svg>
