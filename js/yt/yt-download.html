<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>YouTube 下载</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1f2328; --muted: #6b7280;
    --line: #e5e7eb; --card: #f9fafb;
    --pri: #2563eb; --pri-d: #1d4ed8; --ok: #16a34a; --err: #dc2626; --warn: #d97706;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 14px;
    font: 13px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    color: var(--fg); background: var(--bg);
  }
  h1 { font-size: 14px; font-weight: 600; margin: 0 0 2px; line-height: 1.4;
       display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  .sub b { color: var(--fg); font-weight: 500; }
  .box { border: 1px solid var(--line); border-radius: 10px; padding: 10px; background: var(--card); }
  .row { display: flex; align-items: center; gap: 8px; }
  .qc { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; margin: 10px 0 12px; }
  .q {
    border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px;
    background: #fff; cursor: pointer; text-align: left; font: inherit; color: inherit;
    transition: border-color .12s, background .12s;
  }
  .q:hover { border-color: #c7d2fe; }
  .q[aria-pressed="true"] { border-color: var(--pri); background: #eff6ff; box-shadow: inset 0 0 0 1px var(--pri); }
  .q .t { font-weight: 600; font-size: 13px; }
  .q .s { color: var(--muted); font-size: 11px; }
  .q .badge { display: inline-block; font-size: 10px; padding: 0 5px; border-radius: 4px;
              background: #dcfce7; color: #166534; margin-left: 4px; vertical-align: 1px; }
  button.go {
    width: 100%; padding: 10px; border: 0; border-radius: 9px; cursor: pointer;
    background: var(--pri); color: #fff; font: 600 13px/1 inherit;
  }
  button.go:hover { background: var(--pri-d); }
  button.go:disabled { background: #cbd5e1; cursor: not-allowed; }
  .bar { height: 6px; border-radius: 4px; background: #eef2f7; overflow: hidden; margin: 10px 0 6px; display: none; }
  .bar.on { display: block; }
  .bar i { display: block; height: 100%; width: 0; background: var(--pri); transition: width .2s; }
  .msg { font-size: 12px; color: var(--muted); min-height: 18px; }
  .msg.err { color: var(--err); }
  .msg.ok { color: var(--ok); }
  .msg.warn { color: var(--warn); }
  .file { margin-top: 10px; display: none; }
  .file.on { display: block; }
  .file button {
    width: 100%; padding: 8px; border: 1px solid var(--line); border-radius: 8px;
    background: #fff; cursor: pointer; font: inherit; margin-top: 6px;
  }
  .hint { font-size: 11px; color: var(--muted); margin-top: 10px; line-height: 1.5; }
  a { color: var(--pri); }
</style>
</head>
<body>
  <h1 id="title">正在读取视频信息…</h1>
  <div class="sub" id="sub"></div>

  <div class="box">
    <div class="row" style="justify-content: space-between;">
      <span style="font-weight:600;">清晰度</span>
      <span class="s" id="note" style="color:var(--muted);font-size:11px;"></span>
    </div>
    <div class="qc" id="qc"></div>
    <button class="go" id="go" disabled>下载</button>
    <div class="bar" id="bar"><i></i></div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="file" id="file">
    <button id="openDir">打开下载文件夹</button>
  </div>

  <div class="hint">
    下载后视频轨与音频轨会在本地合并成一个 MP4（不重新编码，画质无损）。<br>
    若合并失败会自动保留两个单独文件，可用任意工具再合。
  </div>

  <script src="../library/path.js"></script>
  <script src="../library/db.js"></script>
  <script src="../vr-download-hook.js"></script>
  <script src="fmp4-merge.js"></script>
  <script src="yt-download.js"></script>
</body>
</html>
