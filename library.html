<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <title>资源库 — 苏哥的钓鱼竿</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" type="text/css" href="css/public.css" media="all" />
  <link rel="stylesheet" type="text/css" href="css/library.css" media="all" />
  <script src="js/library/path.js" defer></script>
  <script src="js/library/db.js" defer></script>
  <script src="js/library/thumbs.js" defer></script>
  <script src="js/library/indexer.js" defer></script>
  <script src="js/library/keyboard.js" defer></script>
  <script src="js/library/video.js" defer></script>
  <script src="js/library/lightbox.js" defer></script>
  <script src="js/library/trash.js" defer></script>
  <script src="js/library/trash-ui.js" defer></script>
  <script src="js/library/rename.js" defer></script>
  <script src="js/library/batch.js" defer></script>
  <script src="js/library/ui.js" defer></script>
</head>

<body class="library-page">
  <header class="lib-top">
    <a class="brand" href="options.html#anchorLibrary" title="返回设置">
      <span class="brand-mark" aria-hidden="true">VR</span>
      <span class="brand-text">
        <strong>苏哥的钓鱼竿</strong>
        <small>本地资源库</small>
      </span>
    </a>

    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <circle cx="11" cy="11" r="7"></circle>
        <path d="m20 20-3.2-3.2"></path>
      </svg>
      <input id="libSearch" type="search" placeholder="搜索文件名、博主、路径…" autocomplete="off" aria-label="搜索资源" />
      <kbd>/</kbd>
    </div>

    <div class="top-actions">
      <div class="viewtoggle" role="group" aria-label="视图切换">
        <button type="button" id="libViewGrid" class="on" data-view="grid" title="网格视图" aria-label="网格视图">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7" rx="1.5"></rect>
            <rect x="14" y="3" width="7" height="7" rx="1.5"></rect>
            <rect x="3" y="14" width="7" height="7" rx="1.5"></rect>
            <rect x="14" y="14" width="7" height="7" rx="1.5"></rect>
          </svg>
        </button>
        <button type="button" id="libViewList" data-view="list" title="列表视图" aria-label="列表视图">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <path d="M4 6h16M4 12h16M4 18h16"></path>
          </svg>
        </button>
      </div>
      <button type="button" id="libBatch" class="btn" aria-pressed="false" title="批量选择">批量</button>
      <button type="button" id="libRefresh" class="btn">刷新</button>
      <button type="button" id="libOptions" class="btn">设置</button>
    </div>
  </header>

  <div class="lib-body">
    <aside class="lib-side" aria-label="资源筛选">
      <div class="side-scroll">
        <div class="side-group">
          <h3>平台</h3>
          <div id="libPlatformNav"></div>
        </div>

        <div class="side-group">
          <h3>博主</h3>
          <div id="libCreatorNav"></div>
        </div>
      </div>

      <div class="side-foot">
        <div class="root">
          <span class="root-bar" aria-hidden="true"></span>
          <div class="root-txt">
            <div class="root-path" id="libRootPath">未探测</div>
            <div class="root-meta" id="libRootMeta">在设置页点「校验落盘」</div>
          </div>
        </div>
        <div class="foot-links">
          <button type="button" class="link-btn" id="libFootOptions">索引维护 / 迁移…</button>
          <button type="button" class="link-btn" id="libTrashOpen">回收站 <span class="foot-count" id="libTrashCount" hidden>0</span></button>
        </div>
      </div>
    </aside>

    <main class="lib-main">
      <div class="lib-head">
        <div class="crumb" id="libCrumb">
          <span>资源库</span><i class="sep">/</i><b>全部资源</b>
        </div>
        <div class="title-row">
          <h1 id="libTitle">全部资源</h1>
          <p id="libSub">共 0 项</p>
          <div class="head-tools">
            <label class="field">
              <span>排序</span>
              <select id="libSort">
                <option value="new">最新</option>
                <option value="old">最旧</option>
                <option value="name">名称</option>
                <option value="size">大小</option>
              </select>
            </label>
            <label class="field">
              <span>分组</span>
              <select id="libGroup">
                <option value="none">平铺</option>
                <option value="date">按日期</option>
              </select>
            </label>
          </div>
        </div>
      </div>

      <div class="lib-scroll" id="libScroll">
        <section class="lib-overview" id="libOverview" aria-label="资源概览" hidden>
          <div class="section-label">
            <span>资源概览</span><i class="ln"></i>
            <span class="hint" id="libOverviewSummary"></span>
            <button type="button" class="link-toggle" id="libOverviewToggle" aria-expanded="false">展开</button>
          </div>

          <div class="overview-body" id="libOverviewBody">
          <div class="kpi-row">
            <article class="kpi">
              <div class="kpi-head">
                <span class="kpi-label">总文件</span>
                <svg class="kpi-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                  <rect x="4" y="4" width="12" height="14" rx="2"></rect>
                  <path d="M8 8h4M8 12h4"></path>
                </svg>
              </div>
              <div class="kpi-num"><b id="libKpiTotal">0</b><span>项</span></div>
              <div class="kpi-foot" id="libKpiTotalFoot">—</div>
              <div class="kpi-bar"><i id="libKpiTotalBar" style="width:100%"></i></div>
            </article>

            <article class="kpi">
              <div class="kpi-head">
                <span class="kpi-label">占用空间</span>
                <svg class="kpi-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                  <ellipse cx="12" cy="6" rx="7" ry="3"></ellipse>
                  <path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6"></path>
                  <path d="M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"></path>
                </svg>
              </div>
              <div class="kpi-num"><b id="libKpiSize">0</b><span id="libKpiSizeUnit"></span></div>
              <div class="kpi-foot" id="libKpiSizeFoot">—</div>
              <div class="kpi-bar"><i style="width:100%"></i></div>
            </article>

            <article class="kpi">
              <div class="kpi-head">
                <span class="kpi-label">图片</span>
                <svg class="kpi-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                  <rect x="3" y="4" width="18" height="16" rx="2.5"></rect>
                  <circle cx="8.5" cy="9.5" r="1.6"></circle>
                  <path d="m4 17 5-5 4 4 3-3 4 4"></path>
                </svg>
              </div>
              <div class="kpi-num"><b id="libKpiImage">0</b><span>张</span></div>
              <div class="kpi-foot" id="libKpiImageFoot">—</div>
              <div class="kpi-bar"><i id="libKpiImageBar" style="width:0"></i></div>
            </article>

            <article class="kpi">
              <div class="kpi-head">
                <span class="kpi-label">视频</span>
                <svg class="kpi-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
                  <rect x="3" y="5" width="18" height="14" rx="2.5"></rect>
                  <path d="m10 9.5 5 2.5-5 2.5z"></path>
                </svg>
              </div>
              <div class="kpi-num"><b id="libKpiVideo">0</b><span>个</span></div>
              <div class="kpi-foot" id="libKpiVideoFoot">—</div>
              <div class="kpi-bar"><i id="libKpiVideoBar" style="width:0"></i></div>
            </article>
          </div>

          <div class="insight-row">
            <section class="insight">
              <header class="insight-head">
                <h2>平台分布</h2>
                <span id="libPlatMeta">—</span>
              </header>
              <div class="stack" id="libPlatStack" role="img" aria-label="平台分布"></div>
              <div class="legend" id="libPlatLegend"></div>
            </section>

            <section class="insight">
              <header class="insight-head">
                <h2>博主产量</h2>
                <span>Top 5</span>
              </header>
              <div class="bars" id="libCreatorBars"></div>
            </section>
          </div>
          </div>
        </section>

        <div class="lib-toolbar">
          <div class="lib-tabs" id="libTypeNav" role="tablist" aria-label="类型筛选"></div>
          <label class="mobile-plat">
            <span>平台</span>
            <select id="libPlatformSelect" aria-label="平台筛选"></select>
          </label>
        </div>

        <div class="active-filters" id="libActiveFilters" hidden></div>

        <section class="lib-block" id="libCreatorBlock" hidden>
          <div class="section-label">
            <span>博主速览</span><i class="ln"></i><span class="hint">点卡片进入博主</span>
          </div>
          <div class="lib-creators" id="libCreators"></div>
        </section>

        <div class="lib-grid" id="libGrid"></div>

        <div class="lib-list" id="libList" hidden>
          <table class="lib-table">
            <thead>
              <tr>
                <th class="c-thumb" scope="col"><span class="sr-only">预览</span></th>
                <th class="c-name" scope="col">名称</th>
                <th class="c-plat" scope="col">平台</th>
                <th class="c-creator" scope="col">博主</th>
                <th class="c-type" scope="col">类型</th>
                <th class="c-size" scope="col">大小</th>
                <th class="c-date" scope="col">下载时间</th>
                <th class="c-act" scope="col"><span class="sr-only">操作</span></th>
              </tr>
            </thead>
            <tbody id="libListBody"></tbody>
          </table>
        </div>

        <div class="lib-empty" id="libEmpty" hidden>
          <div class="empty-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
              <path d="M3 6h18l-2 13H5L3 6Z"></path>
              <path d="m8 6 1-3h6l1 3"></path>
            </svg>
          </div>
          <h2 id="libEmptyTitle">还没有资源</h2>
          <p id="libEmptyText">资源库索引是空的。去设置页重建索引，或先下载一个文件。</p>
          <div class="empty-actions">
            <button type="button" id="libEmptyAction" class="btn primary" data-action="options">去设置页</button>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- 批量操作条 -->
  <div class="batch-bar" id="libBatchBar" hidden role="region" aria-label="批量操作">
    <span class="bb-count" id="libBatchCount">已选 0 项</span>
    <button type="button" class="bbtn" id="libBatchAll">全选</button>
    <button type="button" class="bbtn" id="libBatchClear">取消</button>
    <button type="button" class="bbtn danger" id="libBatchTrash" disabled>移到回收站</button>
    <button type="button" class="bbtn primary" id="libBatchExit">退出</button>
  </div>

  <div class="lib-viewer" id="libViewer" hidden>
    <header class="viewer-top">
      <div class="viewer-title">
        <strong id="libViewerTitle"></strong>
        <span id="libViewerMeta"></span>
      </div>
      <span class="viewer-count" id="libViewerCount">1 / 1</span>
      <div class="viewer-actions">
        <button type="button" class="vbtn" id="libViewerInfoBtn" aria-pressed="true" title="信息 (i)">信息</button>
        <button type="button" class="vbtn" id="libViewerOpen">在文件中打开</button>
        <button type="button" class="vbtn icon" id="libViewerClose" aria-label="关闭预览">✕</button>
      </div>
    </header>

    <div class="viewer-body">
      <button type="button" class="viewer-nav prev" id="libViewerPrev" aria-label="上一个">‹</button>
      <div class="viewer-stage" id="libViewerStage"></div>
      <button type="button" class="viewer-nav next" id="libViewerNext" aria-label="下一个">›</button>

      <aside class="viewer-panel" id="libViewerInfo" aria-label="文件信息">
        <h3>文件信息</h3>
        <dl class="facts" id="libViewerFacts"></dl>
        <div class="panel-acts">
          <button type="button" class="vbtn" id="libViewerCopyPath">复制路径</button>
          <button type="button" class="vbtn" id="libViewerOpen2">在文件中打开</button>
          <button type="button" class="vbtn danger" id="libViewerTrash">移到回收站</button>
        </div>
      </aside>
    </div>

    <div class="video-ctl" id="libVideoCtl" hidden>
      <button type="button" class="vc-btn" id="libVideoPlay" aria-label="播放 / 暂停">▶</button>
      <span class="vc-time" id="libVideoTime">0:00 / 0:00</span>
      <input type="range" id="libVideoSeek" min="0" max="1000" value="0" step="1" aria-label="播放进度" />
      <button type="button" class="vc-btn" id="libVideoMute" aria-label="静音">🔊</button>
      <input type="range" id="libVideoVol" min="0" max="100" value="100" step="1" aria-label="音量" />
      <select id="libVideoRate" aria-label="播放倍速">
        <option value="0.5">0.5×</option>
        <option value="0.75">0.75×</option>
        <option value="1" selected>1×</option>
        <option value="1.25">1.25×</option>
        <option value="1.5">1.5×</option>
        <option value="2">2×</option>
      </select>
      <label class="vc-auto"><input type="checkbox" id="libVideoAuto" checked /> 连播</label>
      <button type="button" class="vc-btn" id="libVideoFull" aria-label="全屏">⛶</button>
    </div>

    <div class="image-ctl" id="libImageCtl" hidden>
      <button type="button" class="vc-btn" id="libViewerZoomOut" aria-label="缩小">−</button>
      <span class="vc-zoom" id="libViewerZoomVal">100%</span>
      <button type="button" class="vc-btn" id="libViewerZoomIn" aria-label="放大">+</button>
      <button type="button" class="vbtn" id="libViewerZoomReset">适应</button>
    </div>

    <div class="viewer-strip" id="libViewerStrip"></div>
  </div>

  <!-- 右键菜单 -->
  <div class="ctxmenu" id="libCtxMenu" hidden role="menu">
    <button type="button" data-act="preview" role="menuitem">预览</button>
    <button type="button" data-act="open" role="menuitem">在文件中打开</button>
    <button type="button" data-act="copy" role="menuitem">复制路径</button>
    <button type="button" data-act="star" role="menuitem">加星标</button>
    <button type="button" data-act="rename" role="menuitem">重命名…</button>
    <div class="ctx-sep"></div>
    <button type="button" data-act="trash" class="danger" role="menuitem">移到回收站</button>
  </div>

  <!-- 回收站抽屉 -->
  <div class="trash-mask" id="libTrashMask" hidden></div>
  <aside class="trash-drawer" id="libTrashDrawer" hidden aria-label="回收站">
    <header class="trash-head">
      <div>
        <h2>回收站</h2>
        <p id="libTrashMeta">—</p>
      </div>
      <button type="button" class="vbtn icon" id="libTrashClose" aria-label="关闭回收站">✕</button>
    </header>
    <div class="trash-list" id="libTrashList"></div>
    <footer class="trash-foot">
      <span class="trash-hint">恢复会写回原路径；彻底删除不可恢复。</span>
      <button type="button" class="btn danger" id="libTrashEmpty">清空回收站</button>
    </footer>
  </aside>

  <!-- 重命名弹窗 -->
  <div class="rename-mask" id="libRenameMask" hidden>
    <div class="rename-box" role="dialog" aria-modal="true" aria-labelledby="libRenameTitle">
      <h3 id="libRenameTitle">重命名</h3>
      <label class="rename-field" for="libRenameInput">文件名（目录不变，扩展名保持一致）</label>
      <input id="libRenameInput" type="text" autocomplete="off" spellcheck="false" />
      <p class="rename-dir" id="libRenameDir"></p>
      <p class="rename-error" id="libRenameError" hidden></p>
      <div class="rename-acts">
        <button type="button" class="btn" id="libRenameCancel">取消</button>
        <button type="button" class="btn primary" id="libRenameOk">保存</button>
      </div>
    </div>
  </div>

  <!-- 确认框 -->
  <div class="confirm-mask" id="libConfirmMask" hidden>
    <div class="confirm-box" role="dialog" aria-modal="true" aria-labelledby="libConfirmTitle">
      <h3 id="libConfirmTitle">确认操作</h3>
      <p id="libConfirmText"></p>
      <div class="confirm-acts">
        <button type="button" class="btn" id="libConfirmCancel">取消</button>
        <button type="button" class="btn danger" id="libConfirmOk">确定</button>
      </div>
    </div>
  </div>

  <div class="lib-toast" id="libToast" hidden></div>
</body>

</html>
