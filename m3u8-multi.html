<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>多段合并 - 钓鱼竿</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f6f7f9;
      color: #1f2329;
      min-height: 100vh;
      padding: 28px 20px 60px;
    }

    .wrap { max-width: 720px; margin: 0 auto; }

    header { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }

    header h1 { font-size: 20px; font-weight: 700; }

    header .tag {
      font-size: 11px;
      color: #c2410c;
      background: #fff0e6;
      border-radius: 4px;
      padding: 2px 7px;
      font-weight: 600;
    }

    .sub { font-size: 12px; color: #646a73; line-height: 1.8; margin-bottom: 18px; }

    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 16px;
      margin-bottom: 14px;
    }

    label { display: block; font-size: 12px; font-weight: 600; color: #37393d; margin-bottom: 6px; }

    .hint { font-size: 11px; color: #8f959e; margin-top: 5px; line-height: 1.6; }

    input[type=text], textarea {
      width: 100%;
      border: 1px solid #d3d8df;
      border-radius: 7px;
      padding: 8px 10px;
      font-size: 12px;
      font-family: ui-monospace, monospace;
      outline: none;
      background: #fff;
      color: #1f2329;
    }

    input[type=text]:focus, textarea:focus { border-color: #c2410c; }

    textarea { min-height: 130px; resize: vertical; line-height: 1.7; }

    .btn {
      border: none;
      border-radius: 8px;
      padding: 9px 22px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
      transition: .15s;
    }

    .btn.primary { background: #1f2329; color: #fff; }
    .btn.primary:hover { background: #33383f; }
    .btn.primary:disabled { background: #c9cdd4; cursor: not-allowed; }

    .seglist { margin-top: 4px; }

    .seg {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid #f0f1f3;
      font-size: 12px;
    }

    .seg:last-child { border-bottom: none; }

    .seg .no {
      flex: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: #f0f1f3;
      color: #646a73;
      font-size: 10px;
      font-weight: 700;
      display: grid;
      place-items: center;
    }

    .seg .url {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #646a73;
      font-family: ui-monospace, monospace;
      font-size: 11px;
    }

    .seg .st { flex: none; font-size: 11px; font-weight: 600; min-width: 110px; text-align: right; }

    .st.waiting { color: #8f959e; }
    .st.downloading { color: #c2410c; }
    .st.done { color: #15803d; }
    .st.error { color: #dc2626; }

    .log {
      font-family: ui-monospace, monospace;
      font-size: 11px;
      line-height: 1.8;
      color: #646a73;
      background: #fafbfc;
      border: 1px solid #f0f1f3;
      border-radius: 7px;
      padding: 10px 12px;
      max-height: 200px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    .bar { height: 6px; background: #f0f1f3; border-radius: 3px; overflow: hidden; margin-top: 10px; display: none; }

    .bar.on { display: block; }

    .bar i {
      display: block;
      height: 100%;
      width: 0;
      background: #c2410c;
      border-radius: 3px;
      transition: width .3s;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <h1>多段合并</h1>
      <span class="tag">M11 · 顺序拼接</span>
    </header>
    <div class="sub">
      一个视频被切成几段独立 m3u8 时用：按下面列表顺序依次下载每一段，拼成一个完整文件（MP4）。<br>
      日常不用打开这个页面——嗅探到同页多段时面板会自动归组，勾选下载就在后台合并，拼好点保存即可。<br>
      本页只给「自动没认出来」时手动兜底：解析/下载/解密/合并全在后台直连完成，不改变画质。
    </div>

    <div class="card">
      <label for="filename">输出文件名</label>
      <input type="text" id="filename" spellcheck="false">
      <div class="hint">落在浏览器下载目录 / video-rod/ 下；同名自动加 (1)(2)</div>
    </div>

    <div class="card">
      <label for="urls">片段地址（每行一个，从上到下就是拼接顺序）</label>
      <textarea id="urls" spellcheck="false" placeholder="https://example.com/video/part1/index.m3u8&#10;https://example.com/video/part2/index.m3u8&#10;https://example.com/video/part3/index.m3u8"></textarea>
      <div class="hint">至少 2 行。每段如果是主清单（多码率），自动选最高码率那一档——各段码率要一致，否则拼出来会花屏。<br>直连下载不带 Referer，个别防盗链站点可能 403</div>
    </div>

    <div class="card">
      <button class="btn primary" id="startBtn">开始拼接</button>
      <div class="bar" id="bar"><i id="barIn"></i></div>
      <div class="seglist" id="seglist"></div>
    </div>

    <div class="card">
      <label>日志</label>
      <div class="log" id="log">等待开始…</div>
    </div>
  </div>

  <script src="lib/mux.min.js"></script>
  <script src="js/vr-download-hook.js"></script>
    <script src="js/m3u8-multi.js"></script>
</body>

</html>
