<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>播放器（iframe 内部）</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; }
  video { display: block; width: 100%; height: 100%; object-fit: cover; }
</style>
</head>
<body>
  <!-- 真实可播的样例，用于验证录制兜底：先播放再录。
       media/ 目录被 .gitignore 忽略，sample.mp4 需自备（1.1MB 的小视频即可）：
       curl -sL -o media/sample.mp4 https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4 -->
  <video id="v" controls muted playsinline
         poster="../media/wide.png"
         src="../media/sample.mp4"></video>
</body>
</html>
