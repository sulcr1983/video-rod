<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>测试站 C：图片批量保存</title>
</head>
<body>
  <h1>图片夹具</h1>
  <!-- 有效大图 1 -->
  <img id="big1" src="media/cover.jpg" width="640" height="480">
  <!-- 有效大图 2 -->
  <img id="big2" src="media/sprite.png" width="300" height="300">
  <!-- 小图：应被 <120×120 过滤 -->
  <img id="tiny" src="media/tiny.png" width="16" height="16">
  <!-- 重复 URL：应去重 -->
  <img id="dup" src="media/cover.jpg" width="640" height="480">
  <!-- 坏图：加载失败应被过滤 -->
  <img id="broken" src="media/test.mp4" width="640" height="480">
</body>
</html>
